<svg width="100%" height="100%" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>

    <!-- Blur Filters -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: url(#cyan-purple);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 2px;
      fill: #94A3B8;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #38BDF8;
    }
    .grid-line {
      stroke: #1E293B;
      stroke-width: 0.7;
      opacity: 0.4;
    }
    .network-node {
      fill: #00F0FF;
      filter: url(#glow);
    }
    .network-node-purple {
      fill: #C084FC;
      filter: url(#glow);
    }
    .network-edge {
      stroke: #38BDF8;
      stroke-width: 1.2;
      stroke-opacity: 0.3;
      stroke-dasharray: 4 2;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" stroke="#1E293B" stroke-width="1"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="160" fill="url(#glow-grad)" filter="url(#blur-large)"/>
  <circle cx="1000" cy="220" r="180" fill="url(#glow-grad)" filter="url(#blur-large)"/>

  <!-- Isometric Cyber Grid Lines -->
  <g opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="320" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="320" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="320" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="320" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="320" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="320" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="320" class="grid-line" />
  </g>

  <!-- Left AI Neural Network Graphic -->
  <g transform="translate(60, 45)">
    <!-- Edges -->
    <line x1="40" y1="60" x2="110" y2="30" class="network-edge"/>
    <line x1="40" y1="60" x2="110" y2="110" class="network-edge"/>
    <line x1="40" y1="160" x2="110" y2="110" class="network-edge"/>
    <line x1="40" y1="160" x2="110" y2="190" class="network-edge"/>
    <line x1="110" y1="30" x2="180" y2="80" class="network-edge"/>
    <line x1="110" y1="110" x2="180" y2="80" class="network-edge"/>
    <line x1="110" y1="110" x2="180" y2="160" class="network-edge"/>
    <line x1="110" y1="190" x2="180" y2="160" class="network-edge"/>

    <!-- Nodes -->
    <circle cx="40" cy="60" r="5" class="network-node"/>
    <circle cx="40" cy="160" r="5" class="network-node"/>
    <circle cx="110" cy="30" r="6" class="network-node-purple"/>
    <circle cx="110" cy="110" r="7" class="network-node"/>
    <circle cx="110" cy="190" r="6" class="network-node-purple"/>
    <circle cx="180" cy="80" r="8" class="network-node"/>
    <circle cx="180" cy="160" r="8" class="network-node-purple"/>

    <!-- Data Pulse Orbit -->
    <circle cx="180" cy="80" r="16" fill="none" stroke="#00F0FF" stroke-width="0.8" opacity="0.5"/>
    <circle cx="110" cy="110" r="14" fill="none" stroke="#C084FC" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Right AI Matrix Graphic -->
  <g transform="translate(970, 50)">
    <!-- Edges -->
    <line x1="30" y1="80" x2="100" y2="40" class="network-edge"/>
    <line x1="30" y1="80" x2="100" y2="130" class="network-edge"/>
    <line x1="30" y1="160" x2="100" y2="130" class="network-edge"/>
    <line x1="100" y1="40" x2="170" y2="70" class="network-edge"/>
    <line x1="100" y1="130" x2="170" y2="70" class="network-edge"/>
    <line x1="100" y1="130" x2="170" y2="170" class="network-edge"/>

    <!-- Nodes -->
    <circle cx="30" cy="80" r="7" class="network-node"/>
    <circle cx="30" cy="160" r="6" class="network-node-purple"/>
    <circle cx="100" cy="40" r="6" class="network-node-purple"/>
    <circle cx="100" cy="130" r="8" class="network-node"/>
    <circle cx="170" cy="70" r="6" class="network-node"/>
    <circle cx="170" cy="170" r="5" class="network-node-purple"/>
  </g>

  <!-- Top Accent Beam -->
  <rect x="250" y="0" width="700" height="2" fill="url(#line-grad)"/>

  <!-- Content Section -->
  <g text-anchor="middle">
    <!-- Subtitle / Role -->
    <text x="600" y="88" class="subtitle-text">✦ AI &amp; Machine Learning Engineer ✦</text>

    <!-- Main Title -->
    <text x="600" y="152" class="title-text">Riya Mehdiratta</text>

    <!-- Research Line -->
    <text x="600" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#CBD5E1">
      Generative AI &amp; LLMs  •  ML Robustness &amp; SCARF  •  Satellite Computer Vision  •  Distributed Systems
    </text>

    <!-- Feature Pills -->
    <g transform="translate(230, 230)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="34" rx="17" fill="url(#card-grad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
        <circle cx="18" cy="17" r="4" fill="#00F0FF" filter="url(#glow)"/>
        <text x="96" y="22" text-anchor="middle" class="pill-text">BVCOE '28 • CGPA 9.67</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="180" height="34" rx="17" fill="url(#card-grad)" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1"/>
        <circle cx="18" cy="17" r="4" fill="#818CF8" filter="url(#glow)"/>
        <text x="103" y="22" text-anchor="middle" class="pill-text">Research Author</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(375, 0)">
        <rect width="185" height="34" rx="17" fill="url(#card-grad)" stroke="#C084FC" stroke-opacity="0.3" stroke-width="1"/>
        <circle cx="18" cy="17" r="4" fill="#C084FC" filter="url(#glow)"/>
        <text x="106" y="22" text-anchor="middle" class="pill-text">1st @ WinterHack '26</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(575, 0)">
        <rect width="165" height="34" rx="17" fill="url(#card-grad)" stroke="#34D399" stroke-opacity="0.3" stroke-width="1"/>
        <circle cx="18" cy="17" r="4" fill="#34D399" filter="url(#glow)"/>
        <text x="96" y="22" text-anchor="middle" class="pill-text">adbis-live-client (2k+)</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Beam -->
  <rect x="350" y="318" width="500" height="2" fill="url(#line-grad)"/>
</svg>
